<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ScreenBrief</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f5f7; --card: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #0a84ff; --ok: #1f9d55; --bad: #d70015; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --fg: #f5f5f7; --muted: #98989d; --line: #38383a; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: max(16px, env(safe-area-inset-top)) 16px 40px; font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 4px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=file], select, textarea, input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  textarea { min-height: 70px; resize: vertical; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 13px 16px; width: 100%; background: var(--accent); color: #fff; margin-top: 14px; }
  button:disabled { opacity: .45; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); margin-top: 8px; }
  progress { width: 100%; height: 10px; margin-top: 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  .rec { padding: 10px 0; border-top: 1px solid var(--line); }
  .rec:first-child { border-top: 0; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .preview { margin-top: 8px; white-space: pre-wrap; font-size: 14px; }
  img.sheet { width: 100%; border-radius: 10px; margin-top: 10px; display: block; }
  .hidden { display: none; }
  code { font: 12px ui-monospace, Menlo, monospace; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>ScreenBrief</h1>
  <p class="sub">Send a screen recording with your spoken feedback to a T3 Code thread.</p>

  <div id="auth" class="card hidden">
    <label for="token">Pairing token</label>
    <input id="token" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Open the link from `screenbrief pair` or paste the token">
    <button id="saveToken">Save</button>
  </div>

  <div id="app" class="hidden">
    <div class="card">
      <label for="file">Recording</label>
      <input id="file" type="file" accept="video/*,.mov,.mp4">
      <label for="thread">Send to</label>
      <select id="thread"><option value="">Loading threads...</option></select>
      <label for="note">Note (optional)</label>
      <textarea id="note" placeholder="Anything to add for the agent"></textarea>
      <button id="upload" disabled>Upload</button>
      <progress id="progress" class="hidden" max="1" value="0"></progress>
      <div id="status" class="muted" style="margin-top:10px"></div>
    </div>

    <div id="current" class="card hidden">
      <div class="row"><strong id="curTitle">Processing</strong><span id="curState" class="pill"></span></div>
      <div id="curPreview" class="preview muted"></div>
      <div id="curDelivery" class="muted" style="margin-top:8px"></div>
      <img id="curSheet" class="sheet hidden" alt="Contact sheet">
    </div>

    <div class="card">
      <div class="row"><strong>Recent recordings</strong><span class="pill" id="hostPill"></span></div>
      <div id="list" class="muted" style="margin-top:8px">Loading...</div>
    </div>
    <button class="secondary" id="forget">Forget this device's token</button>
  </div>
</main>
<script>
(function () {
  'use strict';
  var KEY = 'screenbrief.token';
  var $ = function (id) { return document.getElementById(id); };
  var token = null;

  // Token arrives once as ?token=..., then lives in localStorage; strip it from the URL.
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('token')) {
      localStorage.setItem(KEY, q.get('token').trim());
      history.replaceState(null, '', location.pathname);
    }
    token = localStorage.getItem(KEY);
  } catch (e) {}

  function api(path, opts) {
    opts = opts || {};
    var headers = opts.headers || {};
    headers['Authorization'] = 'Bearer ' + token;
    if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
    return fetch(path, { method: opts.method || 'GET', headers: headers, body: opts.body, cache: 'no-store' }).then(function (r) {
      if (r.status === 401) { showAuth('That token was not accepted.'); throw new Error('unauthorized'); }
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('application/json') >= 0) return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || j.error || ('HTTP ' + r.status)); return j; });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    });
  }

  // Not a secure context on plain http, so no crypto.randomUUID; getRandomValues works.
  function uuid() {
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
    var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }

  function b64url(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function fmtDur(s) { s = Math.round(s || 0); var m = Math.floor(s / 60); return m ? m + 'm ' + String(s % 60).padStart(2, '0') + 's' : s + 's'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function stateText(r) {
    if (r.state === 'processing') return r.stage === 'queued' ? 'queued' : (r.stage || 'processing');
    return r.state;
  }
  function deliveryText(d) {
    if (!d) return '';
    if (d.state === 'sent') return '<span class="ok">Sent to thread</span>' + (d.link ? ' <a href="' + esc(d.link) + '">open</a>' : '');
    if (d.state === 'pending') return 'Will send when processing finishes.';
    return '<span class="bad">Delivery failed: ' + esc(d.error || 'unknown error') + '</span>';
  }

  function showAuth(msg) {
    $('app').classList.add('hidden');
    $('auth').classList.remove('hidden');
    if (msg) $('token').placeholder = msg;
  }

  function loadThreads() {
    api('/api/threads').then(function (j) {
      var sel = $('thread');
      sel.innerHTML = '<option value="">Do not send (just process)</option>';
      var groups = {};
      j.threads.forEach(function (t) { (groups[t.projectName] = groups[t.projectName] || []).push(t); });
      Object.keys(groups).forEach(function (name) {
        var og = document.createElement('optgroup');
        og.label = name;
        groups[name].forEach(function (t) {
          var o = document.createElement('option');
          o.value = 'thread:' + t.threadId;
          o.textContent = t.title;
          og.appendChild(o);
        });
        var o = document.createElement('option');
        o.value = 'project:' + groups[name][0].projectPath;
        o.textContent = '+ New thread in ' + name;
        og.appendChild(o);
        sel.appendChild(og);
      });
      var last = localStorage.getItem('screenbrief.target');
      if (last) sel.value = last;
      if (sel.value !== last) sel.value = '';
    }).catch(function (e) { $('thread').innerHTML = '<option value="">Could not load threads (' + esc(e.message) + ')</option>'; });
  }

  function loadList() {
    api('/api/recordings').then(function (j) {
      if (!j.recordings.length) { $('list').textContent = 'No recordings yet.'; return; }
      $('list').innerHTML = j.recordings.slice(0, 15).map(function (r) {
        return '<div class="rec"><div class="row"><span>' + esc(new Date(r.createdAt).toLocaleString()) + ' &middot; ' + fmtDur(r.durationSec) +
          '</span><span class="pill">' + esc(stateText(r)) + '</span></div>' +
          (r.transcriptPreview ? '<div class="preview">' + esc(r.transcriptPreview) + '</div>' : '') +
          (r.error ? '<div class="bad">' + esc(r.error) + '</div>' : '') +
          (r.delivery ? '<div>' + deliveryText(r.delivery) + '</div>' : '') + '</div>';
      }).join('');
    }).catch(function () {});
  }

  var pollTimer = null;
  function watch(id) {
    $('current').classList.remove('hidden');
    clearTimeout(pollTimer);
    api('/api/recordings/' + encodeURIComponent(id)).then(function (r) {
      $('curState').textContent = stateText(r);
      $('curTitle').textContent = r.state === 'ready' ? 'Ready: ' + r.frameCount + ' frames, ' + fmtDur(r.durationSec) : r.state === 'failed' ? 'Failed' : 'Processing';
      $('curPreview').textContent = r.error ? r.error : (r.transcriptPreview || '');
      $('curDelivery').innerHTML = deliveryText(r.delivery);
      var deliveryPending = r.delivery && r.delivery.state === 'pending';
      if (r.state === 'ready') {
        api('/api/recordings/' + encodeURIComponent(id) + '/contact-sheet.jpg').then(function (res) { return res.blob(); }).then(function (b) {
          var img = $('curSheet'); img.src = URL.createObjectURL(b); img.classList.remove('hidden');
        }).catch(function () {});
        loadList();
      }
      if (r.state === 'processing' || deliveryPending) pollTimer = setTimeout(function () { watch(id); }, 2000);
    }).catch(function () { pollTimer = setTimeout(function () { watch(id); }, 4000); });
  }

  function upload() {
    var f = $('file').files[0];
    if (!f) return;
    var target = $('thread').value;
    localStorage.setItem('screenbrief.target', target);
    var id = uuid();
    var note = $('note').value.trim();
    var meta = { id: id, startedAt: new Date(f.lastModified || Date.now()).toISOString(), source: 'import', device: { name: 'Safari upload', model: navigator.platform || '', os: navigator.userAgent.slice(0, 120) } };
    if (note) meta.note = note;
    if (target.indexOf('thread:') === 0) meta.send = { threadId: target.slice(7) };
    else if (target.indexOf('project:') === 0) meta.send = { projectPath: target.slice(8) };
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/recordings?id=' + encodeURIComponent(id));
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', /mp4/i.test(f.type) || /\.mp4$/i.test(f.name) ? 'video/mp4' : 'video/quicktime');
    xhr.setRequestHeader('X-ScreenBrief-Meta', b64url(JSON.stringify(meta)));
    $('progress').classList.remove('hidden');
    $('progress').value = 0;
    $('upload').disabled = true;
    $('status').textContent = 'Uploading ' + (f.size / 1048576).toFixed(1) + ' MB...';
    xhr.upload.onprogress = function (e) { if (e.lengthComputable) { $('progress').value = e.loaded / e.total; $('status').textContent = 'Uploading ' + Math.round(100 * e.loaded / e.total) + '%'; } };
    xhr.onload = function () {
      $('upload').disabled = false;
      var j = {}; try { j = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status === 202 || xhr.status === 200) {
        $('progress').value = 1;
        $('status').innerHTML = '<span class="ok">Uploaded.</span> You can leave this page; processing and delivery continue on the Mac.';
        $('file').value = ''; $('note').value = '';
        watch(id);
        loadList();
      } else {
        $('status').innerHTML = '<span class="bad">Upload failed: ' + esc(j.message || j.error || ('HTTP ' + xhr.status)) + '</span>';
      }
    };
    xhr.onerror = function () { $('upload').disabled = false; $('status').innerHTML = '<span class="bad">Upload failed: network error. Same Wi-Fi as the Mac?</span>'; };
    xhr.send(f);
  }

  $('file').addEventListener('change', function () { $('upload').disabled = !$('file').files.length; });
  $('upload').addEventListener('click', upload);
  $('saveToken').addEventListener('click', function () { var v = $('token').value.trim(); if (v) { localStorage.setItem(KEY, v); location.reload(); } });
  $('forget').addEventListener('click', function () { localStorage.removeItem(KEY); location.reload(); });

  if (!token) { showAuth(); return; }
  api('/api/health').then(function (h) {
    $('auth').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('hostPill').textContent = h.host;
    loadThreads();
    loadList();
  }).catch(function (e) { if (e.message !== 'unauthorized') showAuth('Could not reach the Mac: ' + e.message); });
})();
</script>
</body>
</html>
